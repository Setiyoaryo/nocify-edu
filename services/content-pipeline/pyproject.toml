[project]
name = "content-pipeline"
version = "0.1.0"
description = "Nocify EduPlay content intelligence pipeline: crawl -> extract -> map -> candidates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "jsonschema>=4.23",
]

[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

# PyMuPDF ships incomplete stubs (its document constructor is untyped), so the
# PDF parser and its tests opt out of the untyped-call check at that boundary.
[[tool.mypy.overrides]]
module = ["content_pipeline.parsers.pdf", "tests.test_pdf_parser", "test_pdf_parser"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
