# Development / testing stack: `docker compose -f infra/compose/compose.yaml up --build`
# App on http://localhost:8000 (Traefik routes /api to the Go API, everything else to SvelteKit).
# On a test VPS set PUBLIC_URL to the address people open, e.g. PUBLIC_URL=http://203.0.113.10:8000
# (state-changing API calls are only accepted from that origin).
name: eduplay-dev

services:
  proxy:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports: ["${HTTP_PORT:-8000}:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduplay
      POSTGRES_PASSWORD: eduplay
      POSTGRES_DB: eduplay
    ports: ["127.0.0.1:55433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduplay"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for development (SeaweedFS, Apache-2.0).
  # MinIO no longer publishes public community images, so it cannot be pulled in CI.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      retries: 20

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    environment: &apienv
      APP_ENV: development
      DATABASE_URL: postgres://eduplay:eduplay@postgres:5432/eduplay?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      SESSION_SECRET: dev-only-session-secret
      # Midtrans sandbox by default: put MIDTRANS_SERVER_KEY (SB-Mid-server-…) in infra/compose/.env.
      # CI and automated E2E run with PAYMENT_PROVIDER=mock (never allowed in production).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-midtrans}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_PRODUCTION: "false"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: s3:8333
      S3_BUCKET: eduplay-dev
      S3_USE_SSL: "false"
      STORAGE_ACCESS_KEY: eduplay
      STORAGE_SECRET_KEY: eduplay-dev-secret
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.services.api.loadbalancer.server.port=8080

  worker:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["worker"]
    # No HTTP listener: healthy while the worker process (PID 1) is alive.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      retries: 3
    environment: *apienv
    depends_on: { api: { condition: service_started } }

  # Content intelligence pipeline (M1). Not started by `up`: it is a batch job.
  #   docker compose -f infra/compose/compose.yaml --profile pipeline run --rm pipeline migrate
  #   docker compose -f infra/compose/compose.yaml --profile pipeline run --rm pipeline sources list
  #   docker compose -f infra/compose/compose.yaml --profile pipeline run --rm pipeline crawl --limit 20
  pipeline:
    profiles: ["pipeline"]
    build: { context: ../.., dockerfile: infra/docker/content-pipeline.Dockerfile }
    environment: &pipeenv
      DATABASE_URL: postgres://eduplay:eduplay@postgres:5432/eduplay?sslmode=disable
      PIPELINE_USER_AGENT: ${PIPELINE_USER_AGENT:-NocifyEduPlayBot/0.1 (+https://github.com/Setiyoaryo/nocify-edu)}
      S3_ENDPOINT: s3:8333
      S3_BUCKET: eduplay-dev
      S3_USE_SSL: "false"
      STORAGE_ACCESS_KEY: eduplay
      STORAGE_SECRET_KEY: eduplay-dev-secret
      # AI provider (M6). Defaults to the deterministic mock so dev runs need no key.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_GENERATION_CAP: ${AI_GENERATION_CAP:-50}
      # Worker daemon (M11): poll for queued jobs + schedule due sources.
      PIPELINE_WORKER_POLL_SECONDS: ${PIPELINE_WORKER_POLL_SECONDS:-5}
      PIPELINE_SCHEDULER_SECONDS: ${PIPELINE_SCHEDULER_SECONDS:-60}
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  # M11: long-running worker that claims UI-triggered jobs and crawls on
  # schedule. Opt-in in dev; always-on in production.
  #   docker compose -f infra/compose/compose.yaml --profile pipeline up -d pipeline-worker
  pipeline-worker:
    profiles: ["pipeline"]
    build: { context: ../.., dockerfile: infra/docker/content-pipeline.Dockerfile }
    command: ["worker"]
    environment: *pipeenv
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  web:
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    environment:
      ORIGIN: ${PUBLIC_URL:-http://localhost:8000}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  pgdata:
  s3data:
