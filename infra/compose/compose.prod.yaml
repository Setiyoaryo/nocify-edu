# Production baseline (§53): proxy (Traefik + Let's Encrypt), web, api, worker, postgres, backup.
# Secrets come from infra/compose/.env (never committed; see .env.example).
# Monitoring is an opt-in profile: `--profile monitoring`.
name: eduplay

services:
  proxy:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --accesslog=true
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eduplay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  api:
    image: ${REGISTRY:-ghcr.io/setiyoaryo}/eduplay-api:${TAG:-latest}
    restart: unless-stopped
    environment: &apienv
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eduplay?sslmode=disable
      PUBLIC_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-midtrans}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_PRODUCTION: ${MIDTRANS_PRODUCTION:-true}
      MONTHLY_PRICE_IDR: ${MONTHLY_PRICE_IDR:-49000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
    volumes:
      - appstorage:/data/storage
      - ../../content:/app/content:ro
    depends_on: { postgres: { condition: service_healthy } }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8080

  worker:
    image: ${REGISTRY:-ghcr.io/setiyoaryo}/eduplay-api:${TAG:-latest}
    restart: unless-stopped
    command: ["worker"]
    # No HTTP listener: healthy while the worker process (PID 1) is alive.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      retries: 3
    environment: *apienv
    depends_on: { api: { condition: service_started } }

  # M11: content pipeline worker — claims UI-triggered jobs and crawls sources on
  # their schedule. Uses the same database (schema-per-owner) as the API.
  pipeline-worker:
    image: ${REGISTRY:-ghcr.io/setiyoaryo}/eduplay-pipeline:${TAG:-latest}
    restart: unless-stopped
    command: ["worker"]
    # No HTTP listener: healthy while the worker process (PID 1) is alive.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      retries: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eduplay?sslmode=disable
      PIPELINE_USER_AGENT: ${PIPELINE_USER_AGENT:-NocifyEduPlayBot/0.1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      PIPELINE_WORKER_POLL_SECONDS: ${PIPELINE_WORKER_POLL_SECONDS:-5}
      PIPELINE_SCHEDULER_SECONDS: ${PIPELINE_SCHEDULER_SECONDS:-60}
    depends_on: { postgres: { condition: service_healthy } }

  web:
    image: ${REGISTRY:-ghcr.io/setiyoaryo}/eduplay-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      ORIGIN: https://${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.web.middlewares=hsts
      - traefik.http.services.web.loadbalancer.server.port=3000

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: eduplay
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
      - ../scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]
    depends_on: { postgres: { condition: service_healthy } }

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.1.0
    restart: unless-stopped

  promtail:
    profiles: [monitoring]
    image: grafana/promtail:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "grafana:/var/lib/grafana"]
    ports: ["127.0.0.1:3001:3000"] # reach via SSH tunnel; never public

volumes:
  pgdata:
  backups:
  letsencrypt:
  prometheus:
  grafana:
  appstorage:
