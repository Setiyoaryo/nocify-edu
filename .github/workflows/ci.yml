name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eduplay, POSTGRES_PASSWORD: eduplay, POSTGRES_DB: eduplay_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - name: Toolchain (go.mod pins the patched release via `toolchain`)
        run: go version
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -p 1 -race ./...
        env: { TEST_DATABASE_URL: "postgres://eduplay:eduplay@localhost:5432/eduplay_test?sslmode=disable" }
      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/compose/compose.yaml up -d --build --wait
        env: { PAYMENT_PROVIDER: mock, PAYMENT_SECRET: ci-only-secret }
      - run: docker compose -f infra/compose/compose.yaml exec -T api eduplay seed --publish
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env: { BASE_URL: "http://localhost:8000", E2E_PAYMENTS: mock }
      - name: Container status and logs (on failure)
        if: failure()
        run: |
          docker compose -f infra/compose/compose.yaml ps -a
          docker compose -f infra/compose/compose.yaml logs --tail=80
      - if: failure()
        uses: actions/upload-artifact@v5
        with: { name: playwright-traces, path: apps/web/test-results }

  images:
    if: github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          for app in api web; do
            docker build -f infra/docker/$app.Dockerfile -t ghcr.io/${{ github.repository_owner }}/eduplay-$app:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/eduplay-$app:latest .
            docker push --all-tags ghcr.io/${{ github.repository_owner }}/eduplay-$app
          done
